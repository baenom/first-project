services:
  - type: web
    name: syncroom-discord-bot
    runtime: python
    rootDir: discord_bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ZEROTIER_API_TOKEN
        sync: false
